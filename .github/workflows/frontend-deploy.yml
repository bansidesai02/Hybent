name: Frontend CI/CD

on:
  push:
    branches: [ yash ]
  pull_request:
    branches: [ main, yash ]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'hireon-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./hireon-frontend
        run: npm ci

      - name: Build Optimized Bundle
        working-directory: ./hireon-frontend
        run: npm run build

      - name: Upload Build Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: hireon-frontend/dist/

  deploy:
    name: Deploy to Hostinger
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/yash'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Push built files to hostinger-deploy branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout --orphan hostinger-deploy-temp
          git rm -rf .
          cp -r dist/. .
          rm -rf dist
          echo "Deployed: $(date)" > DEPLOY_INFO.txt
          git add -A
          git commit -m "Deploy: $(date)"
          git push origin HEAD:hostinger-deploy --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
