services:
  # ── FastAPI Backend ───────────────────────────────────────────────────────
  - type: web
    name: hybent-hiring-backend
    env: docker
    dockerContext: ./hybent-hiring-backend
    dockerfilePath: ./hybent-hiring-backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      # Supabase Postgres (direct connection, port 5432 — NOT the 6543 pgbouncer
      # pooler port, since this service keeps its own long-lived SQLAlchemy pool).
      # Set the actual value in the Render dashboard → Environment tab.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: hybent-hiring-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://hybent.com
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: Hybent Hiring

  # ── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: hybent-hiring-redis
    plan: free
    ipAllowList: [] # Only allow internal traffic

# Postgres is hosted on Supabase (not a Render-managed database) — see
# DATABASE_URL above. Render's free Postgres plan expires and is deleted after
# a fixed lifetime, which is what caused the earlier DNS/connectivity failure.

