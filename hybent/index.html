<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HYBENT — Enterprise AI Software | Makers of Hybent Hiring</title>
  <meta name="description" content="HYBENT builds intelligent software products that simplify business operations using AI. Hybent Hiring, our AI recruitment platform, is live today.">
  <meta name="theme-color" content="#FBFCFE">
  <meta name="author" content="HYBENT">
  <meta property="og:type" content="website">
  <meta property="og:title" content="HYBENT — Enterprise AI Software | Makers of Hybent Hiring">
  <meta property="og:description" content="HYBENT builds intelligent software products that simplify business operations using AI. Hybent Hiring, our AI recruitment platform, is live today.">
  <meta property="og:site_name" content="HYBENT">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    /* Apply the stored view before first paint so signature mode never
       flashes the classic background. */
    (function () {
      try {
        var stored = localStorage.getItem('hybent-theme')
        if (stored === 'signature') document.documentElement.removeAttribute('data-theme')
      } catch (e) {}
    })()
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
