services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: hybent_hiring_postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hybent_hiring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hybent_hiring_db}
    volumes:
      - hybent_hiring_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hybent_hiring -d hybent_hiring_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hybent-hiring-network

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./hybent-hiring-backend
      dockerfile: Dockerfile
    container_name: hybent_hiring_backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Always override DATABASE_URL to use the postgres service hostname.
      # The .env.docker file may have localhost — this ensures it points correctly.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hybent_hiring}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hybent_hiring_db}
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      APP_ENV: development
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RUN_SEED: ${RUN_SEED:-false}
      PYTHONUNBUFFERED: "1"
      UVICORN_RELOAD: "true"
    command: /entrypoint.sh uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    volumes:
      # Live source mount: code changes are picked up without rebuilding.
      - ./hybent-hiring-backend:/app
      # Persists uploaded resumes, JDs, avatars across container rebuilds
      - hybent_hiring_uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    develop:
      watch:
        - action: sync+restart
          path: ./hybent-hiring-backend
          target: /app
    networks:
      - hybent-hiring-network
    # dns:
    #   - 8.8.8.8
    #   - 8.8.4.4

  # ── Redis (Message Broker for Celery) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hybent_hiring_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - hybent-hiring-network

  # ── Celery Worker (Background Executor) ───────────────────────────────────
  celery_worker:
    build:
      context: ./hybent-hiring-backend
      dockerfile: Dockerfile
    container_name: hybent_hiring_celery_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hybent_hiring}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hybent_hiring_db}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      SKIP_PRESTART: "true"
      PYTHONUNBUFFERED: "1"
    volumes:
      - hybent_hiring_uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hybent-hiring-network

  # ── Celery Beat (Scheduler) ───────────────────────────────────────────────
  celery_beat:
    build:
      context: ./hybent-hiring-backend
      dockerfile: Dockerfile
    container_name: hybent_hiring_celery_beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hybent_hiring}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hybent_hiring_db}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      SKIP_PRESTART: "true"
      PYTHONUNBUFFERED: "1"
    volumes:
      - hybent_hiring_uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hybent-hiring-network

  # ── React Frontend (nginx) ────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: hybent_hiring_frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_BASE_URL: ""
      # vite.config.ts's dev proxy defaults to localhost:8000, which inside this
      # container is the frontend container itself, not the backend one.
      VITE_DEV_PROXY_TARGET: http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - ./hybent-hiring-frontend:/app
      - hybent_hiring_frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hybent-hiring-network

  # ── Elasticsearch (Global Search Engine) ──────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: hybent_hiring_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    networks:
      - hybent-hiring-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

# ── Named Volumes ─────────────────────────────────────────────────────────
volumes:
  hybent_hiring_postgres_data:
    driver: local
  hybent_hiring_uploads_data:
    driver: local
  hybent_hiring_frontend_node_modules:
    driver: local

# ── Network ───────────────────────────────────────────────────────────────
networks:
  hybent-hiring-network:
    driver: bridge