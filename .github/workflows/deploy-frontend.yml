name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - yash
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hireon-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd hireon-frontend
          npm install

      - name: Build project
        run: |
          cd hireon-frontend
          npm run build
        env:
          VITE_API_BASE_URL: https://hireon-all-in-one.onrender.com
          VITE_APP_NAME: HireOn

      - name: 🛡️ Validate Build Output
        run: |
          if [ ! -d "hireon-frontend/dist" ]; then
            echo "❌ Build failed: 'dist' folder not found."
            exit 1
          fi
          echo "✅ Build successful. Proceeding to deploy..."

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: hireon-frontend/dist/
          server-dir: ./
          protocol: ftp
