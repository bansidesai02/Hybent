<!doctype html>
<html lang="en" data-theme="classic">
  <head>
    <meta charset="UTF-8" />
    <!-- Square icons only. Google Search requires a 1:1 favicon and will
         otherwise keep a previously crawled icon (the old Hireon mark).
         Do not point rel="icon" at hybent-mark.png — it is 174×209. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFCFE" />
    <!-- Installed app (Add to Home Screen): full-screen, its own name under the icon. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hybent" />
    <meta name="application-name" content="Hybent" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Hybent | AI-Powered Software Products &amp; IT Services</title>
    <meta name="description" content="HYBENT builds intelligent software products that simplify business operations using AI. Hybent Hiring, our AI recruitment platform, is live today." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HYBENT" />
    <meta property="og:url" content="https://hybent.com/" />
    <meta property="og:title" content="Hybent | AI-Powered Software Products &amp; IT Services" />
    <meta property="og:description" content="HYBENT builds intelligent software products that simplify business operations using AI. Hybent Hiring, our AI recruitment platform, is live today." />
    <meta property="og:image" content="https://hybent.com/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HYBENT — the Hybent mark and wordmark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hybent | AI-Powered Software Products &amp; IT Services" />
    <meta name="twitter:description" content="HYBENT builds intelligent software products that simplify business operations using AI. Hybent Hiring, our AI recruitment platform, is live today." />
    <meta name="twitter:image" content="https://hybent.com/og-cover.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "HYBENT",
        "url": "https://hybent.com/",
        "logo": "https://hybent.com/pwa-512x512.png",
        "sameAs": ["https://www.linkedin.com/company/hybent"]
      }
    </script>
    <!-- The marketing site and auth pages stay light — `data-theme="classic"`
         above covers them and nothing here ever touches it. Only a hard
         refresh landing directly on an authenticated workspace URL
         (/hiring/<role>/...) needs this: it reads the same persisted
         preference `AppShell` writes (src/store/themeStore.ts) and applies it
         before first paint, so a dark-mode user doesn't see a flash of light
         while React boots. -->
    <script>
      (function () {
        try {
          if (window.location.pathname.indexOf('/hiring/') !== 0) return
          var raw = window.localStorage.getItem('hybent_hiring_theme')
          var theme = raw && JSON.parse(raw).state && JSON.parse(raw).state.theme
          if (theme === 'dark') {
            document.documentElement.dataset.theme = 'dark'
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* Malformed storage or a disabled localStorage — fall back to light. */
        }
      })()
    </script>
    <!-- Installed-app launch screen: the navbar's mark + wordmark on white,
         shown only when opened as the installed app, from first paint until
         React has rendered (src/pwa/bootScreen.ts fades it out). -->
    <style>
      #hb-boot { position: fixed; inset: 0; z-index: 2147483647; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px; background: #FFFFFF;
        transition: opacity .28s ease; }
      #hb-boot[hidden] { display: none; }
      #hb-boot.hb-boot-out { opacity: 0; pointer-events: none; }
      #hb-boot .hb-boot-mark { width: 72px; height: auto; }
      #hb-boot .hb-boot-word { width: 168px; height: auto; }
      #hb-boot .hb-boot-word-dark { display: none; }
      [data-theme='dark'] #hb-boot { background: #0B0F17; }
      [data-theme='dark'] #hb-boot .hb-boot-word-light { display: none; }
      [data-theme='dark'] #hb-boot .hb-boot-word-dark { display: block; }
    </style>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Hybent company design system: Sora (display), Manrope (body), IBM Plex Mono -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="hb-boot" hidden aria-hidden="true">
      <img class="hb-boot-mark" src="/hybent/hybent-mark-hd.png" alt="" width="260" height="313" />
      <img class="hb-boot-word hb-boot-word-light" src="/hybent/hybent-wordmark-light-hd.png" alt="" width="900" height="99" />
      <img class="hb-boot-word hb-boot-word-dark" src="/hybent/hybent-wordmark-dark-hd.png" alt="" width="900" height="99" />
    </div>
    <script>
      (function () {
        var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true
        if (standalone) document.getElementById('hb-boot').hidden = false
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
