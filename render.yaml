services:
  # ── FastAPI Backend ───────────────────────────────────────────────────────
  - type: web
    name: hybent-hiring-backend
    env: docker
    dockerContext: ./hybent-hiring-backend
    dockerfilePath: ./hybent-hiring-backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      # Supabase Postgres via the SESSION POOLER (port 5432 on
      # aws-<n>-<region>.pooler.supabase.com, username `postgres.<project-ref>`)
      # — NOT the "Direct connection" host (db.<ref>.supabase.co), which
      # resolves IPv6-only on many projects and Render has no IPv6 egress
      # (this is what caused "Network is unreachable" on first deploy).
      # Also NOT the Transaction pooler (port 6543) — this service keeps its
      # own long-lived SQLAlchemy pool, which the Session pooler matches.
      # Set the actual value in the Render dashboard → Environment tab.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: hybent-hiring-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://hybent.com
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: Hybent Hiring
      # Google OAuth client is shared by Calendar and Gmail (email accounts) —
      # register BOTH redirect URIs below on that same client in Google Cloud
      # Console. Client ID/secret are secrets set manually in the dashboard.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://hybent-hiring-backend.onrender.com/v1/calendar/callback
      - key: GMAIL_REDIRECT_URI
        value: https://hybent-hiring-backend.onrender.com/v1/email-accounts/gmail/callback

  # ── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: hybent-hiring-redis
    plan: free
    ipAllowList: [] # Only allow internal traffic

# Postgres is hosted on Supabase (not a Render-managed database) — see
# DATABASE_URL above. Render's free Postgres plan expires and is deleted after
# a fixed lifetime, which is what caused the earlier DNS/connectivity failure.

