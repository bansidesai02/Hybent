services:
  # ── FastAPI Backend ───────────────────────────────────────────────────────
  - type: web
    name: hybent-hiring-backend
    env: docker
    dockerContext: ./hybent-hiring-backend
    dockerfilePath: ./hybent-hiring-backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hybent-hiring-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hybent-hiring-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://hybent.com
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false

  # ── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: hybent-hiring-redis
    plan: free
    ipAllowList: [] # Only allow internal traffic

# ── Databases ───────────────────────────────────────────────────────────────
databases:
  - name: hybent-hiring-db
    plan: free
    postgresMajorVersion: 16

