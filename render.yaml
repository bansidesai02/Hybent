services:
  # ── FastAPI Backend ───────────────────────────────────────────────────────
  - type: web
    name: hybent-hiring-backend
    env: docker
    dockerContext: ./hybent-hiring-backend
    dockerfilePath: ./hybent-hiring-backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      # 1, not 2. This one 512Mi container also runs the Celery worker and
      # beat (entrypoint.sh — the free plan has no background services), and
      # each Uvicorn worker loads its own full copy of the app (~200-250Mi).
      # With 2 workers the container went over 512Mi at startup and Render
      # killed it ("Out of memory", "No open ports detected"). A second web
      # worker needs a plan with more RAM (Standard, 2GB) — Starter is also
      # 512Mi and would not help.
      - key: WEB_CONCURRENCY
        value: "1"
      # Supabase Postgres via the SESSION POOLER (port 5432 on
      # aws-<n>-<region>.pooler.supabase.com, username `postgres.<project-ref>`)
      # — NOT the "Direct connection" host (db.<ref>.supabase.co), which
      # resolves IPv6-only on many projects and Render has no IPv6 egress
      # (this is what caused "Network is unreachable" on first deploy).
      # Also NOT the Transaction pooler (port 6543) — this service keeps its
      # own long-lived SQLAlchemy pool, which the Session pooler matches.
      # Set the actual value in the Render dashboard → Environment tab.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: hybent-hiring-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://hybent.com
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: info@hybent.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: Hybent Hiring
      # Google OAuth client is shared by Calendar and Gmail (email accounts) —
      # register BOTH redirect URIs below on that same client in Google Cloud
      # Console. All four are set manually in the Render dashboard — sync:false
      # so this file can never auto-overwrite whatever you've set there:
      #   GOOGLE_REDIRECT_URI = https://hybent-hiring-backend.onrender.com/v1/calendar/callback
      #   GMAIL_REDIRECT_URI  = https://hybent-hiring-backend.onrender.com/v1/email-accounts/gmail/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false
      # Encrypts connected mailbox OAuth tokens/SMTP passwords at rest — must
      # stay the SAME value across deploys/accounts, or already-encrypted
      # tokens in the DB can no longer be decrypted. Never regenerate this.
      - key: EMAIL_ACCOUNTS_ENCRYPTION_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false

  # ── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: hybent-hiring-redis
    plan: free
    ipAllowList: [] # Only allow internal traffic

# Postgres is hosted on Supabase (not a Render-managed database) — see
# DATABASE_URL above. Render's free Postgres plan expires and is deleted after
# a fixed lifetime, which is what caused the earlier DNS/connectivity failure.

