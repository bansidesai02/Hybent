name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - yash  # Change to main if you use main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hireon-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd hireon-frontend
          npm install

      - name: Build project
        run: |
          cd hireon-frontend
          npm run build
        env:
          VITE_API_BASE_URL: https://hireon-all-in-one.onrender.com
          VITE_APP_NAME: HireOn

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: hireon-frontend/dist/
          server-dir: domains/hirreon.com/public_html/
          protocol: ftp
          state-name: .ftp-deploy-sync-state.json
