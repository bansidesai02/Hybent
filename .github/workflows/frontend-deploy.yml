# Frontend CI/CD - Triggering fresh run

on:
  push:
    branches: [ yash ]
  pull_request:
    branches: [ main, yash ]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'hybent-hiring-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./hybent-hiring-frontend
        run: npm ci

      - name: Build Optimized Bundle
        working-directory: ./hybent-hiring-frontend
        env:
          VITE_API_BASE_URL: https://hybent-hiring-backend.onrender.com
        run: npm run build

      - name: Upload Build Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: hybent-hiring-frontend/dist/
          include-hidden-files: true

  deploy:
    name: Deploy to Hostinger via SFTP
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/yash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Deploy to Hostinger via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002 # Hostinger's standard SFTP port for web/cloud hosting (use 22 if on VPS)
          local_path: './dist/*'
          remote_path: '/public_html'


