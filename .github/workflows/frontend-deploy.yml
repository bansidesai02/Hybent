name: Frontend CI/CD

on:
  push:
    branches: [ yash ]
  pull_request:
    branches: [ main, yash ]

jobs:
  build-and-test:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'hireon-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./hireon-frontend
        run: npm ci

      - name: Build Optimized Bundle
        working-directory: ./hireon-frontend
        run: npm run build

      - name: Create Verification File
        run: |
          echo "DEPLOYED: $(date)" > hireon-frontend/dist/DEPLOY_VERIFY.txt

      - name: Upload Build Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: hireon-frontend/dist/

  deploy:
    name: Deploy to Hostinger
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/yash'
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via lftp (Reliable FTP)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 60;
            set net:max-retries 3;
            open ftp://$FTP_USERNAME:$FTP_PASSWORD@$FTP_SERVER;
            mirror --reverse --delete --verbose dist/ public_html/;
            bye
          "
