services:
  # ── FastAPI Backend ───────────────────────────────────────────────────────
  - type: web
    name: hybent-hiring-backend
    env: docker
    dockerContext: ./hybent-hiring-backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hybent-hiring-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hybent-hiring-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://hybent-hiring-frontend.onrender.com # Update this after first deployment!
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false

  # ── React Frontend (Nginx) ────────────────────────────────────────────────
  - type: web
    name: hybent-hiring-frontend
    env: docker
    dockerContext: ./hybent-hiring-frontend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      # Empty means the bundle uses relative paths, which nginx then proxies —
      # so the browser only ever talks to one origin and CORS never enters it.
      - key: VITE_API_BASE_URL
        value: ""
      # Where that proxy points. The compose service name baked in as the image
      # default does not resolve here, so both must be set to the backend's URL.
      - key: BACKEND_ORIGIN
        fromService:
          type: web
          name: hybent-hiring-backend
          property: host
      - key: BACKEND_HOST
        fromService:
          type: web
          name: hybent-hiring-backend
          property: host

  # ── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: hybent-hiring-redis
    plan: free
    ipAllowList: [] # Only allow internal traffic

# ── Databases ───────────────────────────────────────────────────────────────
databases:
  - name: hybent-hiring-db
    plan: free
    postgresMajorVersion: 16

