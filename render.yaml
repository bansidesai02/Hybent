services:
  # ── FastAPI Backend ───────────────────────────────────────────────────────
  - type: web
    name: hybent-hiring-backend
    env: docker
    dockerContext: ./hybent-hiring-backend
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hybent-hiring-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hybent-hiring-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://hybent-hiring-frontend.onrender.com # Update this after first deployment!
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false

  # ── React Frontend (Nginx) ────────────────────────────────────────────────
  - type: web
    name: hybent-hiring-frontend
    env: docker
    dockerContext: ./hybent-hiring-frontend
    dockerfilePath: Dockerfile
    plan: starter
    envVars:
      - key: VITE_API_BASE_URL
        value: "" # Empty means use relative paths (handled by Nginx proxy)

  # ── Celery Worker ─────────────────────────────────────────────────────────
  - type: worker
    name: hybent-hiring-worker
    env: docker
    dockerContext: ./hybent-hiring-backend
    dockerfilePath: Dockerfile
    dockerCommand: celery -A app.celery_app worker --loglevel=info
    envVars:
      - key: SKIP_PRESTART
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: hybent-hiring-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hybent-hiring-redis
          property: connectionString

  # ── Celery Beat ───────────────────────────────────────────────────────────
  - type: worker
    name: hybent-hiring-beat
    env: docker
    dockerContext: ./hybent-hiring-backend
    dockerfilePath: Dockerfile
    dockerCommand: celery -A app.celery_app beat --loglevel=info
    envVars:
      - key: SKIP_PRESTART
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: hybent-hiring-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hybent-hiring-redis
          property: connectionString

# ── Databases ───────────────────────────────────────────────────────────────
databases:
  - name: hybent-hiring-db
    plan: starter
    postgresMajorVersion: 16

# ── Redis ───────────────────────────────────────────────────────────────────
redis:
  - name: hybent-hiring-redis
    plan: starter
    ipAllowList: [] # Only allow internal traffic
