
services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: hireon_postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hireon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hireon_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireon -d hireon_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hireon-network

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./hireon-backend
      dockerfile: Dockerfile
    container_name: hireon_backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Always override DATABASE_URL to use the postgres service hostname.
      # The .env.docker file may have localhost — this ensures it points correctly.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hireon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hireon_db}
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      APP_ENV: production
    volumes:
      - ./hireon-backend:/app
      # Persists uploaded resumes, JDs, avatars across container rebuilds
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - hireon-network
    dns:
      - 8.8.8.8
      - 8.8.4.4

  # ── Redis (Message Broker for Celery) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hireon_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - hireon-network

  # ── Celery Worker (Background Executor) ───────────────────────────────────
  celery_worker:
    build:
      context: ./hireon-backend
      dockerfile: Dockerfile
    container_name: hireon_celery_worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hireon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hireon_db}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      SKIP_PRESTART: "true"
    volumes:
      - ./hireon-backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hireon-network

  # ── Celery Beat (Scheduler) ───────────────────────────────────────────────
  celery_beat:
    build:
      context: ./hireon-backend
      dockerfile: Dockerfile
    container_name: hireon_celery_beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hireon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hireon_db}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      SKIP_PRESTART: "true"
    volumes:
      - ./hireon-backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hireon-network

  # ── React Frontend (nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./hireon-frontend
      dockerfile: Dockerfile
      args:
        # Baked into the Vite bundle at build time.
        # Using an empty string ensures Axios uses relative paths:
        # requests automatically go to the same host/port as the frontend (e.g. localhost:3000)
        # and nginx handles proxying to the backend.
        VITE_API_BASE_URL: ""
    container_name: hireon_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hireon-network

  # ── Elasticsearch (Global Search Engine) ──────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: hireon_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    networks:
      - hireon-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

# ── Named Volumes ─────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

# ── Network ───────────────────────────────────────────────────────────────
networks:
  hireon-network:
    driver: bridge
