<!doctype html>
<html lang="en" data-theme="classic">
  <head>
    <meta charset="UTF-8" />
    <!-- The official Hybent mark, squared and padded. PNG fallback first for
         browsers that ignore SVG favicons; the SVG wins where both are read. -->
    <link rel="icon" type="image/png" href="/hybent/hybent-mark.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBFCFE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Hybent | AI-Powered Software Products &amp; IT Services</title>
    <meta name="description" content="HYBENT builds intelligent software products that simplify business operations using AI. Hybent Hiring, our AI recruitment platform, is live today." />
    <script>
      /* The company site and its auth pages are light-only — `data-theme` stays
         "classic" on the html tag above and nothing removes it.

         Dark mode belongs to the Hybent Hiring workspaces alone, so restore it
         before first paint for those paths only. Without this the dashboard
         flashes light for a frame before Topbar re-applies the preference. */
      (function () {
        try {
          var workspace = /^\/(dashboard|hiring\/(recruiter|admin|interviewer|portal|super-admin))/
          if (workspace.test(location.pathname) && localStorage.getItem('hybent_hiring_theme') === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Hybent company design system: Sora (display), Manrope (body), IBM Plex Mono -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
