# Frontend CI/CD - Triggering fresh run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, yash ]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'hybent-hiring-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./hybent-hiring-frontend
        run: npm ci

      - name: Build Optimized Bundle
        working-directory: ./hybent-hiring-frontend
        run: npm run build

      - name: Upload Build Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: hybent-hiring-frontend/dist/
          include-hidden-files: true

  deploy:
    name: Deploy to Hostinger via SFTP
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SSH_KEY_SET: ${{ secrets.HOSTINGER_SSH_KEY }}
      PASSWORD_SET: ${{ secrets.HOSTINGER_PASSWORD || secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Validate & Diagnose Secrets
        run: |
          echo "=== Diagnostic Check ==="
          echo "HOSTINGER_HOST / FTP_SERVER: ${{ (secrets.HOSTINGER_HOST || secrets.FTP_SERVER) != '' && 'SET' || 'NOT SET' }}"
          echo "HOSTINGER_USERNAME / FTP_USERNAME: ${{ (secrets.HOSTINGER_USERNAME || secrets.FTP_USERNAME) != '' && 'SET' || 'NOT SET' }}"
          echo "HOSTINGER_PORT: ${{ (secrets.HOSTINGER_PORT || secrets.FTP_PORT) != '' && 'SET' || 'NOT SET' }}"
          echo "HOSTINGER_REMOTE_PATH: ${{ (secrets.HOSTINGER_REMOTE_PATH || secrets.FTP_REMOTE_PATH) != '' && 'SET' || 'NOT SET' }}"
          echo "HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY != '' && 'SET' || 'NOT SET' }}"
          echo "HOSTINGER_PASSWORD / FTP_PASSWORD: ${{ (secrets.HOSTINGER_PASSWORD || secrets.FTP_PASSWORD) != '' && 'SET' || 'NOT SET' }}"
          echo "========================"
          if [ -z "${{ secrets.HOSTINGER_HOST || secrets.FTP_SERVER }}" ] || [ -z "${{ secrets.HOSTINGER_USERNAME || secrets.FTP_USERNAME }}" ]; then
            echo "::error::Missing critical Hostinger secrets. Please configure HOSTINGER_HOST (or FTP_SERVER) and HOSTINGER_USERNAME (or FTP_USERNAME)."
            exit 1
          fi

      # Option A: Deploy using SSH Private Key (Recommended)
      - name: Deploy via SFTP (SSH Key)
        if: ${{ env.SSH_KEY_SET != '' }}
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HOSTINGER_HOST || secrets.FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_USERNAME || secrets.FTP_USERNAME }}
          ssh_private_key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || secrets.FTP_PORT || '65002' }}
          local_path: './dist/*'
          remote_path: ${{ secrets.HOSTINGER_REMOTE_PATH || secrets.FTP_REMOTE_PATH || 'public_html' }}
          sftp_only: true

      # Option B: Deploy using Password (Fallback)
      - name: Deploy via SFTP (Password)
        if: ${{ env.SSH_KEY_SET == '' && env.PASSWORD_SET != '' }}
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HOSTINGER_HOST || secrets.FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD || secrets.FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT || secrets.FTP_PORT || '65002' }}
          local_path: './dist/*'
          remote_path: ${{ secrets.HOSTINGER_REMOTE_PATH || secrets.FTP_REMOTE_PATH || 'public_html' }}
          sftp_only: true


